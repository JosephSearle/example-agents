name: example-agents

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin — web UI for the postgres service above, same "give the dev a UI, not just a
  # connection string" reasoning as running Attu alongside Milvus below. servers.json
  # pre-registers this compose's postgres service so there's nothing to click through on first
  # login beyond entering the password once (see infra/postgres/servers.json).
  pgadmin:
    container_name: postgres-pgadmin
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      # Dev-only login for the pgAdmin UI itself — unrelated to POSTGRES_PASSWORD, never used
      # to authenticate against Postgres. Same pattern as MinIO's hardcoded minioadmin/minioadmin
      # below: a local tool credential, not a secret worth plumbing through .env.
      # NOTE: must not use a reserved TLD (.local/.test/.invalid/.example, RFC 2606) — pgAdmin's
      # email-validator rejects those outright regardless of CHECK_EMAIL_DELIVERABILITY.
      PGADMIN_DEFAULT_EMAIL: admin@example-agents.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/postgres/servers.json:/pgadmin4/servers.json:ro

  mlflow:
    build:
      context: ./packages/mlflow-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlartifacts
      # MLflow's DNS-rebinding protection (MLFLOW_SERVER_ALLOWED_HOSTS, default: localhost/
      # 127.0.0.1/private-IP patterns only) rejects the literal "mlflow:5000" Host header any
      # in-compose-network caller sends — every containerized service here (react-agent/
      # routing-agent's `agents`-profile containers, mlflow-mcp, milvus-mcp) reaches this
      # service via that compose DNS name, not localhost, so it has to be allow-listed
      # explicitly. Host-only entries also cover the bare hostname without a port.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,mlflow,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1"
    command: >
      --backend-store-uri postgresql://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root /mlartifacts
      --serve-artifacts
    volumes:
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MLflow's built-in MCP server (traces/experiments/scorers as MCP tools), run over
  # streamable-http instead of `mlflow mcp run`'s stdio-only default — a persistent, network-
  # reachable service is what makes it resolvable via MLflow's MCP Registry (see
  # packages/mlflow-server/scripts/provision_mcp_registry.py and
  # agents_common.mcp_servers.mlflow_mcp_connection). Same image as `mlflow` above
  # (packages/mlflow-server/mlflow_mcp_server.py), different process.
  mlflow-mcp:
    build:
      context: ./packages/mlflow-server
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    entrypoint: ["python", "mlflow_mcp_server.py"]
    ports:
      - "8001:8001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
      MLFLOW_MCP_PORT: "8001"
    healthcheck:
      # A plain GET against the streamable-http endpoint doesn't necessarily return 2xx (MCP's
      # protocol expects a proper session handshake, not an unauthenticated GET) — a raw socket
      # connect is enough to confirm the process is up and accepting connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Milvus (vector store) + Attu (its web UI) -----------------------------
  # See packages/milvus/README.md for why standalone Milvus needs etcd + MinIO alongside it,
  # and why these use named volumes instead of the bind-mounted ./volumes/ the reference local
  # setup (~/milvus-standalone) uses.
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0-beta
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC — what PyMilvus / langchain-milvus / Attu connect to
      - "9091:9091"    # HTTP metrics/health — what the healthcheck below uses
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy

  # Exposes Milvus operations as MCP tools over streamable-http (see packages/milvus/milvus_mcp_server.py
  # for why this bypasses mcp-server-milvus's own CLI). Not consumed by any agent yet — see the
  # planned RAG-pattern agent in README's Roadmap — registered ahead of time in MLflow's MCP
  # Registry (packages/mlflow-server/scripts/provision_mcp_registry.py) the same way `mlflow-mcp`
  # is, so that agent has a resolvable connection waiting rather than a stdio command to hardcode.
  milvus-mcp:
    build:
      context: ./packages/milvus
    restart: unless-stopped
    depends_on:
      milvus-standalone:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_MCP_PORT: "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5.6
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MILVUS_URL: milvus-standalone:19530
    depends_on:
      milvus-standalone:
        condition: service_healthy

  react-agent:
    build:
      context: .
      dockerfile: agents/patterns/react-agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      # Settings.postgres_uri is built from these components — only POSTGRES_HOST changes
      # from .env's "localhost" default, since containers reach Postgres over the compose
      # network rather than the published host port.
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # The only credential this agent needs — authenticates tracking, evals, and AI Gateway
      # model calls alike. See agents_common.models.get_chat_model.
      MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
    profiles:
      - agents  # `docker compose --profile agents up` — not started by a plain `docker compose up`

  routing-agent:
    build:
      context: .
      dockerfile: agents/patterns/routing-agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      # Settings.postgres_uri is built from these components — only POSTGRES_HOST changes
      # from .env's "localhost" default, since containers reach Postgres over the compose
      # network rather than the published host port.
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # The only credential this agent needs — authenticates tracking, evals, and AI Gateway
      # model calls alike. See agents_common.models.get_chat_model.
      MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
    profiles:
      - agents  # `docker compose --profile agents up` — not started by a plain `docker compose up`

volumes:
  postgres-data:
  pgadmin-data:
  mlflow-artifacts:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
