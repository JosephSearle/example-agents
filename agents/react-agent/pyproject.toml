[project]
name            = "react-agent"
version         = "0.1.0"
description     = "Reference implementation of the single-agent ReAct pattern using langchain.agents.create_agent."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "langchain>=1.0",
    "langgraph>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }

[project.scripts]
react-agent = "react_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_agent"]
