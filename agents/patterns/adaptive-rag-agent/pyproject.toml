[project]
name            = "adaptive-rag-agent"
version         = "0.1.0"
description     = "Reference implementation of the Adaptive RAG workflow — routes each question by complexity to a no-retrieval, single-step (Corrective RAG), or multi-step (Query Decomposition) branch — using a raw LangGraph StateGraph with a conditional entry point."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "basic-rag-agent",
    "langgraph>=0.6",
    "langchain-milvus>=0.1",
    "pymilvus>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }
basic-rag-agent = { workspace = true }

[project.scripts]
adaptive-rag-agent = "adaptive_rag_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_rag_agent"]
