[project]
name            = "basic-rag-agent"
version         = "0.1.0"
description     = "Reference implementation of the basic RAG (retrieve-then-generate) workflow, backed by Milvus, using a raw LangGraph StateGraph."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "langgraph>=0.6",
    "langchain-milvus>=0.1",
    "pymilvus>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }

[project.scripts]
basic-rag-agent = "basic_rag_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_rag_agent"]
