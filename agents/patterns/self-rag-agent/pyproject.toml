[project]
name            = "self-rag-agent"
version         = "0.1.0"
description     = "Reference implementation of the Self-RAG workflow — grades retrieved documents like Corrective RAG, then also grades its own generation for groundedness and usefulness, looping to regenerate or re-retrieve as needed — using a raw LangGraph StateGraph."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "basic-rag-agent",
    "langgraph>=0.6",
    "langchain-milvus>=0.1",
    "pymilvus>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }
basic-rag-agent = { workspace = true }

[project.scripts]
self-rag-agent = "self_rag_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_rag_agent"]
