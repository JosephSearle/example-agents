[project]
name            = "supervisor-agent"
version         = "0.1.0"
description     = "Reference implementation of the supervisor multi-agent pattern (sub-agents wrapped as delegate tools) using langchain.agents.create_agent."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "langchain>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }

[project.scripts]
supervisor-agent = "supervisor_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor_agent"]
