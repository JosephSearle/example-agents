[project]
name            = "experiment-analysis-agent"
version         = "0.1.0"
description     = "Tier 3 (deepagents) reference implementation: hypothesis-driven MLflow AI Issue Discovery over an agent's traces."
readme          = "README.md"
requires-python = ">=3.12"

dependencies = [
    "agents-common",
    "langchain>=1.0",
    "langgraph>=0.6",
    "deepagents",
    "langchain-mcp-adapters",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.uv.sources]
agents-common = { workspace = true }

[project.scripts]
experiment-analysis-agent = "experiment_analysis_agent.__main__:main"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_analysis_agent"]
