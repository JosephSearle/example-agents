<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Self-RAG flowchart with retry loop: Question, Retrieve, Grade Documents, Generate, Check Groundedness, Check Usefulness, Answer, with a Rewrite Query loop back to Retrieve on failing grades">
  <title>Self-RAG</title>
  <style>
    :root{
      --diagram-bg:#0A0A0A;
      --node-fill:#141414;
      --node-stroke:rgba(255,255,255,0.12);
      --edge-color:#6b7280;
      --accent-color:#0368FF;
      --text-color:#f4f4f5;
      --muted-text:#7c828d;
      --pass-color:#2FBF71;
      --fail-color:#FF2B6E;
    }
    .selfrag-title{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .selfrag-sub{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted-text);letter-spacing:.12em;}
    .selfrag-label{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .selfrag-label2{font:600 11.5px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .selfrag-tag{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.02em;}
    .selfrag-badge{font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.03em;}
    .selfrag-nodebox{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1;}
    .selfrag-edge{stroke:var(--accent-color);stroke-width:1.75;fill:none;stroke-dasharray:5 10;stroke-linecap:round;opacity:.7;animation:selfrag-dash .9s linear infinite;}
    .selfrag-loop{stroke:var(--accent-color);stroke-width:1.75;fill:none;stroke-dasharray:6 9;stroke-linecap:round;opacity:.6;animation:selfrag-dash 1.1s linear infinite;}

    @keyframes selfrag-dash{to{stroke-dashoffset:-15;}}

    .selfrag-flashcg-r{opacity:0;animation:selfrag-cg-red 12s ease-in-out infinite;}
    .selfrag-flashcg-g{opacity:0;animation:selfrag-cg-green 12s ease-in-out infinite;}
    .selfrag-flashcu-r{opacity:0;animation:selfrag-cu-red 12s ease-in-out infinite;}
    .selfrag-flashcu-g{opacity:0;animation:selfrag-cu-green 12s ease-in-out infinite;}
    @keyframes selfrag-cg-red{0%{opacity:0}20%{opacity:0}22%{opacity:.6}26%{opacity:.6}29%{opacity:0}100%{opacity:0}}
    @keyframes selfrag-cg-green{0%{opacity:0}60%{opacity:0}62%{opacity:.6}65%{opacity:.6}68%{opacity:0}94%{opacity:0}95.5%{opacity:.6}97%{opacity:.6}98.5%{opacity:0}100%{opacity:0}}
    @keyframes selfrag-cu-red{0%{opacity:0}65%{opacity:0}67%{opacity:.6}70%{opacity:.6}73%{opacity:0}100%{opacity:0}}
    @keyframes selfrag-cu-green{0%{opacity:0}96%{opacity:0}97%{opacity:.6}98.5%{opacity:.6}99.5%{opacity:0}100%{opacity:0}}

    .selfrag-badge1{opacity:0;animation:selfrag-badge1 12s ease-in-out infinite;}
    .selfrag-badge2{opacity:0;animation:selfrag-badge2 12s ease-in-out infinite;}
    @keyframes selfrag-badge1{0%{opacity:0}33%{opacity:0}35%{opacity:1}47%{opacity:1}49%{opacity:0}100%{opacity:0}}
    @keyframes selfrag-badge2{0%{opacity:0}77%{opacity:0}79%{opacity:1}88%{opacity:1}90%{opacity:0}100%{opacity:0}}

    .selfrag-packet{animation:selfrag-travel 12s ease-in-out infinite;}
    @keyframes selfrag-travel{
      0%{transform:translate(0,0);opacity:0}
      1.5%{transform:translate(0,0);opacity:1}
      6%{transform:translate(106px,0)}
      9%{transform:translate(106px,0)}
      12%{transform:translate(228px,0)}
      16%{transform:translate(348px,0)}
      20%{transform:translate(468px,0)}
      22%{transform:translate(468px,0)}
      25%{transform:translate(468px,0)}
      27%{transform:translate(468px,46px)}
      30%{transform:translate(468px,130px)}
      32%{transform:translate(378px,130px)}
      34%{transform:translate(368px,170px)}
      36%{transform:translate(368px,170px)}
      39%{transform:translate(288px,230px)}
      42%{transform:translate(176px,242px)}
      45%{transform:translate(106px,130px)}
      47%{transform:translate(106px,36px)}
      48%{transform:translate(106px,0)}
      50%{transform:translate(106px,0)}
      54%{transform:translate(228px,0)}
      58%{transform:translate(348px,0)}
      61%{transform:translate(468px,0)}
      63%{transform:translate(468px,0)}
      65%{transform:translate(618px,0)}
      67%{transform:translate(618px,0)}
      69%{transform:translate(618px,0)}
      71%{transform:translate(618px,46px)}
      73%{transform:translate(618px,110px)}
      75%{transform:translate(388px,110px)}
      77%{transform:translate(388px,148px)}
      78%{transform:translate(368px,170px)}
      80%{transform:translate(368px,170px)}
      82.5%{transform:translate(288px,230px)}
      85%{transform:translate(176px,242px)}
      87%{transform:translate(106px,130px)}
      88%{transform:translate(106px,36px)}
      89%{transform:translate(106px,0)}
      91%{transform:translate(228px,0)}
      93%{transform:translate(348px,0)}
      95%{transform:translate(468px,0)}
      96%{transform:translate(468px,0)}
      97%{transform:translate(618px,0)}
      98%{transform:translate(618px,0)}
      99%{transform:translate(758px,0);opacity:1}
      99.7%{transform:translate(758px,0);opacity:1}
      100%{transform:translate(758px,0);opacity:0}
    }
    .selfrag-pulse{transform-box:fill-box;transform-origin:center;animation:selfrag-pulse 1.4s ease-out infinite;}
    @keyframes selfrag-pulse{0%{opacity:.6;transform:scale(.6)}70%{opacity:0;transform:scale(2.3)}100%{opacity:0;transform:scale(2.3)}}

    @media (prefers-reduced-motion: reduce){
      .selfrag-edge,.selfrag-loop,.selfrag-packet,.selfrag-pulse,
      .selfrag-flashcg-r,.selfrag-flashcg-g,.selfrag-flashcu-r,.selfrag-flashcu-g,
      .selfrag-badge1,.selfrag-badge2{animation:none !important;}
      .selfrag-packet{opacity:1;}
      .selfrag-pulse{opacity:0;}
    }
  </style>
  <defs>
    <linearGradient id="selfrag-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0368FF"/><stop offset="30%" stop-color="#8D30FF"/><stop offset="55%" stop-color="#FF4FBA"/><stop offset="78%" stop-color="#FF2B6E"/><stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <marker id="selfrag-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--accent-color)"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="var(--diagram-bg)"/>

  <text class="selfrag-sub" x="40" y="52">SELF-REFLECTIVE RAG</text>
  <text class="selfrag-title" x="40" y="84" fill="url(#selfrag-grad)">Self-RAG</text>

  <!-- Loop-back arc (Rewrite Query -> Retrieve), clearly below main flow -->
  <path class="selfrag-loop" d="M360,340 C 270,438 168,432 168,200" marker-end="url(#selfrag-arrow)"/>
  <text class="selfrag-tag" x="238" y="424" text-anchor="middle" fill="var(--muted-text)">loop back to retrieve</text>

  <!-- Fail arrows into Rewrite Query -->
  <path class="selfrag-edge" d="M530,218 L530,300 L462,300 L462,314" marker-end="url(#selfrag-arrow)"/>
  <path class="selfrag-edge" d="M680,218 L680,282 L400,282 L400,314" marker-end="url(#selfrag-arrow)"/>
  <text class="selfrag-tag" x="538" y="256" text-anchor="start" fill="var(--fail-color)">Not grounded</text>
  <text class="selfrag-tag" x="610" y="275" text-anchor="start" fill="var(--fail-color)">Not useful</text>

  <!-- Forward arrows -->
  <line class="selfrag-edge" x1="104" y1="170" x2="126" y2="170" marker-end="url(#selfrag-arrow)"/>
  <line class="selfrag-edge" x1="210" y1="170" x2="238" y2="170" marker-end="url(#selfrag-arrow)"/>
  <line class="selfrag-edge" x1="342" y1="170" x2="362" y2="170" marker-end="url(#selfrag-arrow)"/>
  <line class="selfrag-edge" x1="458" y1="170" x2="468" y2="170" marker-end="url(#selfrag-arrow)"/>
  <line class="selfrag-edge" x1="592" y1="170" x2="618" y2="170" marker-end="url(#selfrag-arrow)"/>
  <line class="selfrag-edge" x1="742" y1="170" x2="772" y2="170" marker-end="url(#selfrag-arrow)"/>
  <text class="selfrag-tag" x="605" y="159" text-anchor="middle" fill="var(--pass-color)">Grounded</text>
  <text class="selfrag-tag" x="768" y="159" text-anchor="end" fill="var(--pass-color)">Useful</text>

  <!-- Rect nodes -->
  <rect class="selfrag-nodebox" x="20" y="144" width="84" height="52" rx="12"/>
  <text class="selfrag-label" x="62" y="170" text-anchor="middle" dominant-baseline="middle">Question</text>

  <rect class="selfrag-nodebox" x="126" y="144" width="84" height="52" rx="12"/>
  <text class="selfrag-label" x="168" y="170" text-anchor="middle" dominant-baseline="middle">Retrieve</text>

  <rect class="selfrag-nodebox" x="238" y="144" width="104" height="52" rx="12"/>
  <text class="selfrag-label2" x="290" y="170" text-anchor="middle" dominant-baseline="middle"><tspan x="290" dy="-0.35em">Grade</tspan><tspan x="290" dy="1.2em">Documents</tspan></text>

  <rect class="selfrag-nodebox" x="362" y="144" width="96" height="52" rx="12"/>
  <text class="selfrag-label" x="410" y="170" text-anchor="middle" dominant-baseline="middle">Generate</text>

  <rect class="selfrag-nodebox" x="360" y="315" width="140" height="50" rx="12"/>
  <text class="selfrag-label" x="430" y="340" text-anchor="middle" dominant-baseline="middle">Rewrite Query</text>

  <rect class="selfrag-nodebox" x="772" y="144" width="96" height="52" rx="12"/>
  <text class="selfrag-label" x="820" y="170" text-anchor="middle" dominant-baseline="middle">Answer</text>

  <!-- Diamond bases -->
  <polygon class="selfrag-nodebox" points="468,170 530,124 592,170 530,216"/>
  <polygon class="selfrag-nodebox" points="618,170 680,124 742,170 680,216"/>

  <!-- Flash overlays -->
  <polygon class="selfrag-flashcg-r" points="468,170 530,124 592,170 530,216" fill="var(--fail-color)" stroke="var(--fail-color)" stroke-width="2"/>
  <polygon class="selfrag-flashcg-g" points="468,170 530,124 592,170 530,216" fill="var(--pass-color)" stroke="var(--pass-color)" stroke-width="2"/>
  <polygon class="selfrag-flashcu-r" points="618,170 680,124 742,170 680,216" fill="var(--fail-color)" stroke="var(--fail-color)" stroke-width="2"/>
  <polygon class="selfrag-flashcu-g" points="618,170 680,124 742,170 680,216" fill="var(--pass-color)" stroke="var(--pass-color)" stroke-width="2"/>

  <!-- Diamond labels (on top) -->
  <text class="selfrag-label2" x="530" y="170" text-anchor="middle" dominant-baseline="middle"><tspan x="530" dy="-0.35em">Check</tspan><tspan x="530" dy="1.2em">Grounded?</tspan></text>
  <text class="selfrag-label2" x="680" y="170" text-anchor="middle" dominant-baseline="middle"><tspan x="680" dy="-0.35em">Check</tspan><tspan x="680" dy="1.2em">Useful?</tspan></text>

  <!-- Retry counter badges -->
  <g class="selfrag-badge1">
    <rect x="536" y="329" width="64" height="22" rx="11" fill="var(--node-fill)" stroke="var(--fail-color)" stroke-width="1.25"/>
    <text class="selfrag-badge" x="568" y="340" text-anchor="middle" dominant-baseline="middle" fill="var(--fail-color)">Retry 1</text>
  </g>
  <g class="selfrag-badge2">
    <rect x="536" y="329" width="64" height="22" rx="11" fill="var(--node-fill)" stroke="var(--fail-color)" stroke-width="1.25"/>
    <text class="selfrag-badge" x="568" y="340" text-anchor="middle" dominant-baseline="middle" fill="var(--fail-color)">Retry 2</text>
  </g>

  <!-- Traveling packet -->
  <g class="selfrag-packet">
    <circle class="selfrag-pulse" cx="62" cy="170" r="9" fill="none" stroke="var(--accent-color)" stroke-width="2"/>
    <circle cx="62" cy="170" r="11" fill="var(--accent-color)" opacity="0.22"/>
    <circle cx="62" cy="170" r="5.5" fill="var(--accent-color)"/>
    <circle cx="60" cy="168" r="2" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
