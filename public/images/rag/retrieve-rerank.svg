<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Retrieve-then-Rerank pipeline: Question, Vector Search k=20, 20 candidate documents, Cross-Encoder Reranker funnel, 3 surviving documents, Generate, Answer">
  <title>Retrieve-then-Rerank</title>
  <style>
    :root{
      --diagram-bg:#0A0A0A;
      --node-fill:#141414;
      --node-stroke:rgba(255,255,255,0.12);
      --edge-color:#6b7280;
      --accent-color:#0368FF;
      --text-color:#f4f4f5;
      --muted-text:#9ca3af;
      --doc-accent:#0b2b5e;
      --doc-muted:#20242c;
      --doc-muted-stroke:#454b57;
      --funnel-fill:rgba(3,104,255,0.06);
      --funnel-stroke:rgba(3,104,255,0.45);
    }
    .rerank-title{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .rerank-sub{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted-text);letter-spacing:.12em;}
    .rerank-label{font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .rerank-label2{font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .rerank-cap{font:600 11px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted-text);letter-spacing:.02em;}
    .rerank-nodebox{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1;}
    .rerank-edge{stroke:var(--edge-color);stroke-width:1.5;fill:none;}
    .rerank-funnel{fill:var(--funnel-fill);stroke:var(--funnel-stroke);stroke-width:1.25;}

    .rerank-flow{stroke:var(--accent-color);stroke-width:2;fill:none;stroke-dasharray:5 11;stroke-linecap:round;opacity:.85;animation:rerank-dash .9s linear infinite;}
    @keyframes rerank-dash{to{stroke-dashoffset:-16;}}

    .rerank-doc{transform-box:fill-box;transform-origin:center;opacity:.9;}
    .rerank-reject{animation:rerank-reject 4.5s ease-in-out infinite;}
    @keyframes rerank-reject{
      0%{opacity:0;transform:translate(0,0) scale(.85);}
      12%{opacity:.85;transform:translate(0,0) scale(1);}
      26%{opacity:.85;transform:translate(0,0) scale(1);}
      52%{opacity:.6;transform:translate(calc(var(--dx)*0.78),calc(var(--dy)*0.78)) scale(.9);}
      64%{opacity:0;transform:translate(calc(var(--dx)*0.92),calc(var(--dy)*0.92)) scale(.7);}
      100%{opacity:0;transform:translate(calc(var(--dx)*0.92),calc(var(--dy)*0.92)) scale(.7);}
    }
    .rerank-survive{animation:rerank-survive 4.5s ease-in-out infinite;}
    @keyframes rerank-survive{
      0%{opacity:0;transform:translate(0,0) scale(.85);}
      12%{opacity:.9;transform:translate(0,0) scale(1);}
      26%{opacity:1;transform:translate(0,0) scale(1);}
      56%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1);}
      78%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(1.05);}
      92%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(1);}
      100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(1);}
    }

    @media (prefers-reduced-motion: reduce){
      .rerank-reject,.rerank-survive,.rerank-flow{animation:none !important;}
      .rerank-doc{opacity:.9;transform:none;}
    }
  </style>
  <defs>
    <linearGradient id="rerank-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0368FF"/><stop offset="30%" stop-color="#8D30FF"/><stop offset="55%" stop-color="#FF4FBA"/><stop offset="78%" stop-color="#FF2B6E"/><stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <marker id="rerank-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--edge-color)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="var(--diagram-bg)"/>

  <text class="rerank-sub" x="40" y="52">RETRIEVE-THEN-RERANK</text>
