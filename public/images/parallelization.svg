<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-label="Parallelization workflow with two variations: Sectioning splits a task into three independent subtasks that run simultaneously and are aggregated; Voting runs three identical attempts of the same task simultaneously and keeps the consensus result">
  <title>Parallelization</title>
  <style>
    :root{
      --diagram-bg:#0A0A0A;
      --node-fill:#111111;
      --node-stroke:rgba(255,255,255,0.10);
      --edge-color:#5b616c;
      --accent-color:#0368FF;
      --branch-1:#0368FF;
      --branch-2:#B44BFF;
      --branch-3:#FF7A59;
      --text-color:#f4f4f5;
      --muted-text:#8b909b;
      --divider:rgba(255,255,255,0.07);
    }
    .parallel-title{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .parallel-sub{font:500 12px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--muted-text);letter-spacing:.12em;}
    .parallel-half{font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.06em;}
    .parallel-halfsub{font:500 10.5px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted-text);letter-spacing:.01em;}
    .parallel-label{font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .parallel-label2{font:600 11.5px system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--text-color);}
    .parallel-nodebox{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:1;}
    .parallel-flow{fill:none;stroke-width:2;stroke-dasharray:5 11;stroke-linecap:round;opacity:.8;animation:parallel-dash .9s linear infinite;}
    .parallel-c1{stroke:var(--branch-1);}
    .parallel-c2{stroke:var(--branch-2);}
    .parallel-c3{stroke:var(--branch-3);}
    @keyframes parallel-dash{to{stroke-dashoffset:-16;}}

    .parallel-packet{animation:parallel-run 4.5s cubic-bezier(0.22,1,0.36,1) infinite;}
    @keyframes parallel-run{
      0%{transform:translate(0,0);opacity:0}
      4%{transform:translate(0,0);opacity:1}
      11%{transform:translate(0,0)}
      30%{transform:translate(210px,var(--dy))}
      40%{transform:translate(210px,var(--dy))}
      64%{transform:translate(450px,0)}
      70%{transform:translate(450px,0);opacity:1}
      73%{transform:translate(450px,0);opacity:0}
      100%{transform:translate(450px,0);opacity:0}
    }
    .parallel-merge{animation:parallel-mrun 4.5s cubic-bezier(0.22,1,0.36,1) infinite;}
    @keyframes parallel-mrun{
      0%{transform:translate(0,0);opacity:0}
      70%{transform:translate(0,0);opacity:0}
      73%{transform:translate(0,0);opacity:1}
      90%{transform:translate(130px,0);opacity:1}
      95%{transform:translate(130px,0);opacity:0}
      100%{transform:translate(130px,0);opacity:0}
    }
    .parallel-pulse{transform-box:fill-box;transform-origin:center;animation:parallel-pulse 1.5s ease-out infinite;}
    @keyframes parallel-pulse{0%{opacity:.5;transform:scale(.6)}70%{opacity:0;transform:scale(2.2)}100%{opacity:0;transform:scale(2.2)}}

    @media (prefers-reduced-motion: reduce){
      .parallel-packet,.parallel-merge,.parallel-pulse,.parallel-flow{animation:none !important;}
      .parallel-packet{opacity:1;}
      .parallel-merge{opacity:0;}
      .parallel-pulse{opacity:0;}
    }
  </style>
  <defs>
    <linearGradient id="parallel-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0368FF"/><stop offset="30%" stop-color="#8D30FF"/><stop offset="55%" stop-color="#FF4FBA"/><stop offset="78%" stop-color="#FF2B6E"/><stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <marker id="parallel-a1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--branch-1)"/></marker>
    <marker id="parallel-a2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--branch-2)"/></marker>
    <marker id="parallel-a3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--branch-3)"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="490" fill="var(--diagram-bg)"/>

  <text class="parallel-sub" x="40" y="38">WORKFLOW · TWO VARIATIONS</text>
  <text class="parallel-title" x="40" y="70" fill="url(#parallel-grad)">Parallelization</text>

  <line x1="40" y1="290" x2="860" y2="290" stroke="var(--divider)" stroke-width="1"/>

  <!-- ===== SECTIONING (top) ===== -->
  <text class="parallel-half" x="40" y="112" fill="var(--branch-1)">SECTIONING</text>
  <text class="parallel-halfsub" x="152" y="112">independent subtasks · combined</text>

  <path class="parallel-flow parallel-c1" d="M150,192 C 200,150 200,150 242,148" marker-end="url(#parallel-a1)"/>
  <line class="parallel-flow parallel-c2" x1="150" y1="200" x2="242" y2="200" marker-end="url(#parallel-a2)"/>
  <path class="parallel-flow parallel-c3" d="M150,208 C 200,252 200,252 242,252" marker-end="url(#parallel-a3)"/>
  <path class="parallel-flow parallel-c1" d="M395,148 C 455,150 455,188 509,193" marker-end="url(#parallel-a1)"/>
  <line class="parallel-flow parallel-c2" x1="395" y1="200" x2="509" y2="200" marker-end="url(#parallel-a2)"/>
  <path class="parallel-flow parallel-c3" d="M395,252 C 455,250 455,212 509,207" marker-end="url(#parallel-a3)"/>
  <line class="parallel-flow parallel-c1" x1="608" y1="200" x2="645" y2="200" marker-end="url(#parallel-a1)"/>

  <rect class="parallel-nodebox" x="70" y="178" width="80" height="44" rx="11"/>
  <text class="parallel-label" x="110" y="200" text-anchor="middle" dominant-baseline="middle">Task</text>

  <rect class="parallel-nodebox" x="245" y="128" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="148" text-anchor="middle" dominant-baseline="middle">Subtask A</text>
  <rect class="parallel-nodebox" x="245" y="180" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="200" text-anchor="middle" dominant-baseline="middle">Subtask B</text>
  <rect class="parallel-nodebox" x="245" y="232" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="252" text-anchor="middle" dominant-baseline="middle">Subtask C</text>

  <rect class="parallel-nodebox" x="512" y="176" width="96" height="48" rx="11"/>
  <text class="parallel-label" x="560" y="200" text-anchor="middle" dominant-baseline="middle">Aggregate</text>

  <rect class="parallel-nodebox" x="648" y="178" width="84" height="44" rx="11"/>
  <text class="parallel-label2" x="690" y="200" text-anchor="middle" dominant-baseline="middle">Output</text>

  <g class="parallel-packet" style="--dy:-52px;">
    <circle class="parallel-pulse" cx="110" cy="200" r="8" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="110" cy="200" r="10" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="110" cy="200" r="5" fill="var(--branch-1)"/>
    <circle cx="108.5" cy="198.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-packet" style="--dy:0px;">
    <circle class="parallel-pulse" cx="110" cy="200" r="8" fill="none" stroke="var(--branch-2)" stroke-width="2"/>
    <circle cx="110" cy="200" r="10" fill="var(--branch-2)" opacity="0.22"/>
    <circle cx="110" cy="200" r="5" fill="var(--branch-2)"/>
    <circle cx="108.5" cy="198.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-packet" style="--dy:52px;">
    <circle class="parallel-pulse" cx="110" cy="200" r="8" fill="none" stroke="var(--branch-3)" stroke-width="2"/>
    <circle cx="110" cy="200" r="10" fill="var(--branch-3)" opacity="0.22"/>
    <circle cx="110" cy="200" r="5" fill="var(--branch-3)"/>
    <circle cx="108.5" cy="198.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-merge">
    <circle class="parallel-pulse" cx="560" cy="200" r="9" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="560" cy="200" r="11" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="560" cy="200" r="5.5" fill="var(--branch-1)"/>
    <circle cx="558" cy="198" r="2" fill="#fff" opacity="0.85"/>
  </g>

  <!-- ===== VOTING (bottom) ===== -->
  <text class="parallel-half" x="40" y="322" fill="var(--branch-1)">VOTING</text>
  <text class="parallel-halfsub" x="122" y="322">same task ×3 · keep consensus</text>

  <path class="parallel-flow parallel-c1" d="M150,392 C 200,350 200,350 242,348" marker-end="url(#parallel-a1)"/>
  <line class="parallel-flow parallel-c1" x1="150" y1="400" x2="242" y2="400" marker-end="url(#parallel-a1)"/>
  <path class="parallel-flow parallel-c1" d="M150,408 C 200,452 200,452 242,452" marker-end="url(#parallel-a1)"/>
  <path class="parallel-flow parallel-c1" d="M395,348 C 448,350 448,388 493,393" marker-end="url(#parallel-a1)"/>
  <line class="parallel-flow parallel-c1" x1="395" y1="400" x2="493" y2="400" marker-end="url(#parallel-a1)"/>
  <path class="parallel-flow parallel-c1" d="M395,452 C 448,450 448,412 493,407" marker-end="url(#parallel-a1)"/>
  <line class="parallel-flow parallel-c1" x1="624" y1="400" x2="645" y2="400" marker-end="url(#parallel-a1)"/>

  <rect class="parallel-nodebox" x="70" y="378" width="80" height="44" rx="11"/>
  <text class="parallel-label" x="110" y="400" text-anchor="middle" dominant-baseline="middle">Task</text>

  <rect class="parallel-nodebox" x="245" y="328" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="348" text-anchor="middle" dominant-baseline="middle">Attempt (same task)</text>
  <rect class="parallel-nodebox" x="245" y="380" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="400" text-anchor="middle" dominant-baseline="middle">Attempt (same task)</text>
  <rect class="parallel-nodebox" x="245" y="432" width="150" height="40" rx="10"/>
  <text class="parallel-label2" x="320" y="452" text-anchor="middle" dominant-baseline="middle">Attempt (same task)</text>

  <rect class="parallel-nodebox" x="496" y="376" width="128" height="48" rx="11"/>
  <text class="parallel-label2" x="560" y="400" text-anchor="middle" dominant-baseline="middle">Vote / Consensus</text>

  <rect class="parallel-nodebox" x="648" y="378" width="84" height="44" rx="11"/>
  <text class="parallel-label2" x="690" y="400" text-anchor="middle" dominant-baseline="middle">Output</text>

  <g class="parallel-packet" style="--dy:-52px;">
    <circle class="parallel-pulse" cx="110" cy="400" r="8" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="110" cy="400" r="10" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="110" cy="400" r="5" fill="var(--branch-1)"/>
    <circle cx="108.5" cy="398.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-packet" style="--dy:0px;">
    <circle class="parallel-pulse" cx="110" cy="400" r="8" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="110" cy="400" r="10" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="110" cy="400" r="5" fill="var(--branch-1)"/>
    <circle cx="108.5" cy="398.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-packet" style="--dy:52px;">
    <circle class="parallel-pulse" cx="110" cy="400" r="8" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="110" cy="400" r="10" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="110" cy="400" r="5" fill="var(--branch-1)"/>
    <circle cx="108.5" cy="398.5" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <g class="parallel-merge">
    <circle class="parallel-pulse" cx="560" cy="400" r="9" fill="none" stroke="var(--branch-1)" stroke-width="2"/>
    <circle cx="560" cy="400" r="11" fill="var(--branch-1)" opacity="0.22"/>
    <circle cx="560" cy="400" r="5.5" fill="var(--branch-1)"/>
    <circle cx="558" cy="398" r="2" fill="#fff" opacity="0.85"/>
  </g>
</svg>
