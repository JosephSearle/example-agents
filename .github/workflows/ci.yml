name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-unit:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync workspace (all packages, frozen lockfile)
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check agents packages

      - name: Ruff format check
        run: uv run ruff format --check agents packages

      - name: mypy
        run: uv run mypy agents packages

      - name: Unit tests
        run: uv run pytest -m unit --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
