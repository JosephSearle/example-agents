name: integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration tests (real Postgres checkpointer)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: agents
          POSTGRES_DB: agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings.postgres_uri is built from these — matches the postgres service block above.
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Integration tests
        run: uv run pytest -m integration
